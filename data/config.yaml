# Polaris 全局默认配置
# 此文件应提交至 git，作为所有环境的基准配置。
# 本地敏感/覆盖配置请放入 data/config.local.yaml（已 gitignore）。

llm:
  api_key: ""           # 敏感信息留空，在 config.local.yaml 中填写
  model: "gpt-4o"
  base_url: "https://api.openai.com/v1"
  temperature: 0.7
  max_tokens: 4096

embedding:
  api_key: ""
  base_url: ""
  model: "netease-youdao/bce-embedding-base_v1"

channels:
  feishu:
    plugin: "src.channels.feishu"
    enabled: false
    app_id: ""
    app_secret: ""
  qq:
    plugin: "src.channels.qq"
    enabled: false
    bot_appid: ""
    bot_secret: ""

tools:
  calendar:
    use_mock: true
    google_credentials: ""
    google_calendar_id: "primary"
  web_search:
    api_key: ""
    api_base: "https://api.tavily.com"

reminders:
  check_interval: 30

cleanup:
  enabled: true
  archive_dir: "data/archive"
  archive_max_age_days: 30
  reminders_retention_days: 7
  calendar_retention_days: 14
  todos_retention_days: 30

storage:
  sessions_dir: "data/sessions"
  calendar_file: "data/calendar.json"
  todos_file: "data/todos.json"
  reminders_file: "data/reminders.json"
  notes_dir: "data/notes"
  vector_db_dir: "data/chroma"
  profile_file: "data/user_profile.json"

server:
  host: "0.0.0.0"
  port: 8000
  admin_token: ""
  rate_limit_max_requests: 30
  rate_limit_window_seconds: 60
  max_sessions: 10

admin:
  enabled: true

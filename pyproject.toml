[project]
name = "polaris"
version = "1.0.0"
description = "Personal efficiency AI Agent with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "chromadb",
    "pyyaml",
    "tiktoken",
    "lark-oapi",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "httpx",
    "qq-botpy",
    "apscheduler>=3.10,<4",
    "pydantic>=2.0",
    "PyMySQL>=1.1,<2",      # team 模式的公共库（MySQL 5.6+）
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# 终端客户端（polaris 命令）；httpx 已是主依赖
cli = [
    "prompt_toolkit>=3.0.53,<4",
    "rich>=13,<16",
]

[project.scripts]
polaris = "src.cli.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
